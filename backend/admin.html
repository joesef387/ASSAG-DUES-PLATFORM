<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASSAG UCC Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header>
        <h1>ASSA Admin Dashboard</h1>
        <p>Semester Dues Management</p>
    </header>

    <main>

        <section class="dashboard">

    <h2>Dues Overview</h2>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Dues</h3>
            <p id="totalDues">GH₵0</p>
        </div>

        <div class="stat-card">
            <h3>Paid</h3>
            <p id="paidStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingStudents">0</p>
        </div>

    </div>

    <h2>Dues Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Level</th>
                        <th>Membership</th>
                        <th>Semester</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="duesTableBody">
                    <!-- Records will appear here -->
                </tbody>

            </table>

        </section>

    </main>

    <script src="admin.js"></script>

</body>
</html>
